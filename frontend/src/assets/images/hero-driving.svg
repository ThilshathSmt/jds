<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-label="Learner car on a road with traffic signs">
  <!-- PLACEHOLDER ILLUSTRATION: replace with an official Jeslan Driving School photo/illustration if available -->

  <!-- backdrop -->
  <ellipse cx="325" cy="225" rx="295" ry="205" fill="#fdecec"/>
  <circle cx="500" cy="95" r="34" fill="#fff" opacity=".9"/>
  <path d="M150 120h70a22 22 0 0 0 0-44 30 30 0 0 0-56-8 26 26 0 0 0-14 52z" fill="#fff" opacity=".9"/>

  <!-- distant buildings -->
  <g fill="#f7c9cb">
    <rect x="210" y="210" width="46" height="140"/>
    <rect x="262" y="180" width="58" height="170"/>
    <rect x="326" y="225" width="44" height="125"/>
    <rect x="376" y="195" width="62" height="155"/>
    <rect x="444" y="235" width="40" height="115"/>
  </g>

  <!-- road -->
  <rect x="0" y="350" width="640" height="90" rx="10" fill="#27272a"/>
  <path d="M24 395h592" stroke="#fff" stroke-width="6" stroke-dasharray="42 30" stroke-linecap="round"/>

  <!-- speed limit sign -->
  <rect x="71" y="190" width="8" height="165" fill="#71717a"/>
  <circle cx="75" cy="160" r="40" fill="#fff" stroke="#d6202a" stroke-width="11"/>
  <text x="75" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1b1b1f">50</text>

  <!-- stop sign -->
  <rect x="566" y="170" width="8" height="185" fill="#71717a"/>
  <polygon points="610.600,146.800 586.800,170.600 553.200,170.600 529.400,146.800 529.400,113.200 553.200,89.400 586.800,89.400 610.600,113.200" fill="#d6202a" stroke="#fff" stroke-width="5"/>
  <text x="570" y="139" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#fff">STOP</text>

  <!-- car -->
  <g transform="translate(135 232)">
    <ellipse cx="192" cy="168" rx="190" ry="9" fill="#000" opacity=".35"/>
    <!-- L plate -->
    <rect x="186" y="-24" width="38" height="36" rx="4" fill="#fff" stroke="#d6202a" stroke-width="4"/>
    <text x="205" y="5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#d6202a">L</text>
    <!-- body -->
    <path d="M10 96q0-26 30-30l56-8q34-46 80-48h74q42 2 70 48l30 8q24 6 24 32v22q0 12-12 12H22q-12 0-12-12z" fill="#d6202a"/>
    <path d="M10 108h364v12q0 12-12 12H22q-12 0-12-12z" fill="#a8141c"/>
    <!-- windows -->
    <path d="M114 58q26-32 62-34h28v34z" fill="#e0f2fe"/>
    <path d="M218 24h30q30 2 50 34h-80z" fill="#e0f2fe"/>
    <!-- door lines + handles -->
    <path d="M211 24v104" stroke="#a8141c" stroke-width="3"/>
    <rect x="176" y="72" width="22" height="6" rx="3" fill="#fff" opacity=".9"/>
    <rect x="262" y="72" width="22" height="6" rx="3" fill="#fff" opacity=".9"/>
    <!-- lights -->
    <rect x="356" y="78" width="18" height="13" rx="4" fill="#fde68a"/>
    <rect x="10" y="80" width="11" height="15" rx="3" fill="#6e0c12"/>
    <!-- wheels -->
    <g>
      <circle cx="94" cy="132" r="35" fill="#1b1b1f"/>
      <circle cx="94" cy="132" r="16" fill="#d4d4d8"/>
      <circle cx="94" cy="132" r="5" fill="#71717a"/>
      <circle cx="292" cy="132" r="35" fill="#1b1b1f"/>
      <circle cx="292" cy="132" r="16" fill="#d4d4d8"/>
      <circle cx="292" cy="132" r="5" fill="#71717a"/>
    </g>
  </g>

  <!-- cones -->
  <g>
    <path d="M40 440l16-52h10l16 52z" fill="#f97316"/>
    <path d="M49 411h24l4 12H45z" fill="#fff"/>
    <rect x="30" y="438" width="62" height="9" rx="3" fill="#f97316"/>
    <path d="M548 440l16-52h10l16 52z" fill="#f97316"/>
    <path d="M557 411h24l4 12h-32z" fill="#fff"/>
    <rect x="538" y="438" width="62" height="9" rx="3" fill="#f97316"/>
  </g>
</svg>
