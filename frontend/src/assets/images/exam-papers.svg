<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Exam paper on a clipboard next to road signs">
  <!-- PLACEHOLDER ILLUSTRATION: replace with an official Jeslan Driving School illustration if available -->

  <!-- backdrop -->
  <ellipse cx="240" cy="185" rx="225" ry="160" fill="#fdecec"/>
  <circle cx="390" cy="70" r="26" fill="#fff" opacity=".9"/>
  <path d="M70 92h56a18 18 0 0 0 0-36 24 24 0 0 0-45-6 21 21 0 0 0-11 42z" fill="#fff" opacity=".9"/>

  <!-- clipboard -->
  <rect x="150" y="62" width="180" height="236" rx="16" fill="#a8141c"/>
  <rect x="164" y="80" width="152" height="204" rx="8" fill="#fff"/>
  <rect x="200" y="50" width="80" height="30" rx="10" fill="#1b1b1f"/>
  <circle cx="240" cy="58" r="5" fill="#fff"/>

  <!-- paper heading -->
  <rect x="184" y="100" width="92" height="10" rx="5" fill="#1b1b1f"/>
  <rect x="184" y="118" width="60" height="7" rx="3.5" fill="#d4d4d8"/>

  <!-- answered questions -->
  <g>
    <rect x="184" y="146" width="18" height="18" rx="5" fill="#d6202a"/>
    <path d="M188 155l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="212" y="151" width="84" height="8" rx="4" fill="#e4e4e7"/>
  </g>
  <g>
    <rect x="184" y="182" width="18" height="18" rx="5" fill="#d6202a"/>
    <path d="M188 191l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="212" y="187" width="70" height="8" rx="4" fill="#e4e4e7"/>
  </g>
  <g>
    <rect x="184" y="218" width="18" height="18" rx="5" fill="none" stroke="#d6202a" stroke-width="3"/>
    <rect x="212" y="223" width="78" height="8" rx="4" fill="#e4e4e7"/>
  </g>
  <rect x="184" y="254" width="50" height="8" rx="4" fill="#e4e4e7"/>

  <!-- pencil -->
  <g transform="rotate(35 330 230)">
    <rect x="318" y="150" width="22" height="110" rx="3" fill="#f59e0b"/>
    <rect x="318" y="150" width="22" height="16" rx="3" fill="#f7c9cb"/>
    <polygon points="318,260 340,260 329,284" fill="#fde68a"/>
    <polygon points="325,275 333,275 329,284" fill="#1b1b1f"/>
  </g>

  <!-- speed limit sign -->
  <rect x="78" y="200" width="7" height="110" fill="#71717a"/>
  <circle cx="81.5" cy="180" r="32" fill="#fff" stroke="#d6202a" stroke-width="9"/>
  <text x="81.5" y="191" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1b1b1f">50</text>

  <!-- warning sign -->
  <rect x="398" y="196" width="7" height="114" fill="#71717a"/>
  <polygon points="401.5,140 438,204 365,204" fill="#fff" stroke="#d6202a" stroke-width="8" stroke-linejoin="round"/>
  <rect x="398" y="160" width="7" height="24" rx="3" fill="#1b1b1f"/>
  <circle cx="401.5" cy="193" r="4" fill="#1b1b1f"/>

  <!-- ground -->
  <rect x="40" y="306" width="400" height="8" rx="4" fill="#f7c9cb"/>
</svg>
